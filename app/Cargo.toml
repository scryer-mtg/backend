[package]
name = "scryer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
foundation = { version = "0.1.0", path = "../foundation" }
opentelemetry = { version = "0.30.0" }
opentelemetry-appender-tracing = "0.30.1"
opentelemetry-otlp = { version = "0.30.0", features = ["grpc-tonic", "zstd-tonic"] }
opentelemetry-semantic-conventions = { version = "0.30.0", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.30.0", features = ["trace", "metrics", "logs", "rt-tokio"] }
scryer-persistence = { path = "../persistence", features = ["sqlite"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = { version = "0.1.41", features = ["async-await"] }
tracing-opentelemetry = { version = "0.31.0", features = ["async-trait"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = "1.18.0"

[build-dependencies]
built = { version = "0.8.0", features = ["git2", "semver"] }
